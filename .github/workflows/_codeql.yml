name: "CodeQL Analysis"

on:
  workflow_call:
    inputs:
      cache-mode:
        description: "Cache mode override (empty = auto-compute from event context)."
        type: string
        default: ""
      fetch-only:
        description: "When true, runs --nobuild to fetch dependencies only."
        type: string
        default: "false"
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL:
        required: false

jobs:
  codeql:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ""
          cache-mode: ${{ inputs.cache-mode }}
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Fetch dependencies (--nobuild)
        if: inputs.fetch-only == 'true'
        run: bazel build --nobuild //...

      - name: Install CodeQL query pack dependencies
        if: inputs.fetch-only != 'true'
        run: |
          set -euo pipefail

          CODEQL_BIN_REL=$(bazel cquery @codeql_bundle//:codeql_cli --output=files | head -n1)
          REPORT_BIN_REL=$(bazel cquery @codeql_coding_standards//:analysis_report --output=files | head -n1)

          resolve_path() {
            local p="$1"
            if [[ "$p" = /* ]]; then
              echo "$p"
            else
              echo "${GITHUB_WORKSPACE}/$p"
            fi
          }

          CODEQL_BIN=$(resolve_path "$CODEQL_BIN_REL")
          REPORT_BIN=$(resolve_path "$REPORT_BIN_REL")

          find_pack_root() {
            local report_bin="$1"
            local report_dir
            report_dir=$(dirname "$report_bin")
            local -a candidates=(
              "${report_dir}/cpp/common/src"
              "${report_dir}/../cpp/common/src"
              "${report_dir}/../../cpp/common/src"
              "${report_bin}.runfiles/+_repo_rules4+codeql_coding_standards/cpp/common/src"
              "${report_bin}.runfiles/codeql_coding_standards/cpp/common/src"
            )

            for c in "${candidates[@]}"; do
              if [[ -d "$c" ]]; then
                realpath "$c"
                return 0
              fi
            done
            return 1
          }

          if ! PACK_ROOT=$(find_pack_root "$REPORT_BIN"); then
            echo "::error::Unable to locate CodeQL pack root near REPORT_BIN=${REPORT_BIN}"
            echo "Checked candidate locations:"
            echo "  $(dirname "$REPORT_BIN")/cpp/common/src"
            echo "  $(dirname "$REPORT_BIN")/../cpp/common/src"
            echo "  $(dirname "$REPORT_BIN")/../../cpp/common/src"
            echo "  ${REPORT_BIN}.runfiles/+_repo_rules4+codeql_coding_standards/cpp/common/src"
            echo "  ${REPORT_BIN}.runfiles/codeql_coding_standards/cpp/common/src"
            exit 1
          fi

          echo "CodeQL binary: ${CODEQL_BIN}"
          echo "Report binary: ${REPORT_BIN}"
          echo "Pack root: ${PACK_ROOT}"

          if [[ ! -x "${CODEQL_BIN}" ]]; then
            echo "::error::CodeQL binary not found or not executable: ${CODEQL_BIN}"
            exit 1
          fi

          if [[ ! -d "${PACK_ROOT}" ]]; then
            echo "::error::CodeQL pack root not found: ${PACK_ROOT}"
            exit 1
          fi

          "${CODEQL_BIN}" pack install "${PACK_ROOT}"

      - name: Run CodeQL analysis
        if: inputs.fetch-only != 'true'
        id: run-codeql
        run: |
          set -euo pipefail

          echo "━━━ CodeQL runner and Bazel path diagnostics ━━━"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "RUNNER_WORKSPACE=${RUNNER_WORKSPACE:-<unset>}"
          echo "RUNNER_TEMP=${RUNNER_TEMP:-<unset>}"
          echo "PWD=$(pwd)"

          BAZEL_OUTPUT_BASE=$(bazel info output_base)
          BAZEL_OUTPUT_PATH=$(bazel info output_path)
          BAZEL_EXECUTION_ROOT=$(bazel info execution_root)
          BAZEL_WORKSPACE=$(bazel info workspace)

          echo "bazel info output_base=${BAZEL_OUTPUT_BASE}"
          echo "bazel info output_path=${BAZEL_OUTPUT_PATH}"
          echo "bazel info execution_root=${BAZEL_EXECUTION_ROOT}"
          echo "bazel info workspace=${BAZEL_WORKSPACE}"

          if [[ -d "${BAZEL_OUTPUT_BASE}/external" ]]; then
            echo "Contents under ${BAZEL_OUTPUT_BASE}/external (depth <= 2):"
            find "${BAZEL_OUTPUT_BASE}/external" -maxdepth 2 -mindepth 1 -type d | sed 's|^|  |'
          else
            echo "Directory not found: ${BAZEL_OUTPUT_BASE}/external"
          fi

          bazel run //quality/static_analysis:codeql_lint -- \
            --output-dir /tmp/codeql-results \
            --output-prefix codeql-nightly \
            --target //score/message_passing //score/mw/com

      - name: Upload SARIF to GitHub Code Scanning
        if: inputs.fetch-only != 'true' && always() && steps.run-codeql.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/codeql-results/codeql-nightly.sarif
          category: codeql-nightly

      - name: Upload CSV results
        if: inputs.fetch-only != 'true' && always() && steps.run-codeql.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-csv-results
          path: /tmp/codeql-results/codeql-nightly.csv
          retention-days: 30

      - name: Debug - Check generated reports before upload
        if: inputs.fetch-only != 'true' && always()
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║ CodeQL - Generated Reports Debug Log                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "━━━ STEP 1: CodeQL Results Directory ━━━"
          if [ -d /tmp/codeql-results ]; then
            echo "✓ Results directory found: /tmp/codeql-results"
            echo ""
            echo "All files in /tmp/codeql-results:"
            find /tmp/codeql-results -type f -exec ls -lh {} \; | awk '{print "  " $9 " (" $5 ")"}'
            echo ""
            TOTAL_FILES=$(find /tmp/codeql-results -type f | wc -l)
            echo "Total files: $TOTAL_FILES"
          else
            echo "✗ ERROR: /tmp/codeql-results directory does not exist!"
          fi

          echo ""
          echo "━━━ STEP 2: Analysis Reports Subdirectory ━━━"
          if [ -d /tmp/codeql-results/analysis_reports ]; then
            echo "✓ analysis_reports directory found"
            echo ""
            echo "Markdown report files (.md):"
            find /tmp/codeql-results/analysis_reports -name '*.md' -type f -exec ls -lh {} \; | awk '{print "  " $9 " (" $5 ")"}'
            echo ""
            MD_COUNT=$(find /tmp/codeql-results/analysis_reports -name '*.md' -type f | wc -l)
            echo "Total .md files: $MD_COUNT"

            if [ "$MD_COUNT" -eq 0 ]; then
              echo ""
              echo "⚠️  WARNING: No markdown reports found in analysis_reports!"
              echo ""
              echo "All files in analysis_reports:"
              find /tmp/codeql-results/analysis_reports -type f | sed 's|^|  |'
            fi
          else
            echo "✗ analysis_reports directory NOT found"
            echo ""
            echo "Directory structure:"
            find /tmp/codeql-results -type d | sed 's|^|  |'
          fi

          echo ""
          echo "╚════════════════════════════════════════════════════════════╝"

      - name: Upload MISRA compliance reports
        if: inputs.fetch-only != 'true' && always() && steps.run-codeql.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-misra-reports
          path: /tmp/codeql-results/analysis_reports/
          retention-days: 30
          if-no-files-found: warn
